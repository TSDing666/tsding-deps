name: build-r2ghidra

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config wget unzip zip pax gperf python-is-python3 zlib1g-dev patch radare2

      - name: Checkout radare2 6.2.0
        run: git clone --depth 1 --branch 6.2.0 https://github.com/radareorg/radare2

      - name: Build r2 Android SDK (arm64, official recipe)
        run: |
          cd radare2
          sys/android-ndk-install.sh 28 arm64
          sys/android-sdk.sh -a arm64 --api 28 -j "$(nproc)" -o r2sdk.zip
          unzip -q r2sdk.zip -d ../sdk

      - name: Download r2ghidra 6.2.2 dist tarball (includes materialized subprojects)
        run: |
          wget -q https://github.com/radareorg/r2ghidra/releases/download/6.2.2/r2ghidra-6.2.2.tar.xz
          tar xJf r2ghidra-6.2.2.tar.xz

      - name: Apply sleighc native patch
        run: |
          cd r2ghidra-6.2.2
          git apply --verbose ../patches/sleighc-native.patch || patch -p1 -N < ../patches/sleighc-native.patch
          grep -n "sleighc-native" subprojects/ghidra-native/meson.build | head -2

      - name: Write meson cross file
        run: |
          TC="$PWD/radare2/toolchain/bin"
          SDKDIR="$PWD/sdk/radare2-6.2.0-android-sdk/lib/arm64-v8a/pkgconfig"
          {
            echo "[binaries]"
            echo "c = '$TC/aarch64-linux-android28-clang'"
            echo "cpp = '$TC/aarch64-linux-android28-clang++'"
            echo "ar = '$TC/llvm-ar'"
            echo "strip = '$TC/llvm-strip'"
            echo "pkg-config = 'pkg-config'"
            echo "[host_machine]"
            echo "system = 'android'"
            echo "cpu_family = 'aarch64'"
            echo "cpu = 'aarch64'"
            echo "endian = 'little'"
            echo "[properties]"
            echo "needs_exe_wrapper = true"
            echo "pkg_config_libdir = ['$SDKDIR']"
          } > cross-android-arm64.ini
          cat cross-android-arm64.ini

      - name: Meson cross build
        run: |
          cd r2ghidra-6.2.2
          meson setup build --buildtype=release --cross-file ../cross-android-arm64.ini -Dprefix=/tmp/r2home
          ninja -C build

      - name: Collect artifacts
        run: |
          mkdir -p out
          find r2ghidra-6.2.2/build -name '*.so' -exec cp {} out/ \;
          (cd r2ghidra-6.2.2/build && find . -name '*.sla' | zip -q ../sleigh-compiled.zip -@) || true
          cp r2ghidra-6.2.2/build/sleigh-compiled.zip out/ 2>/dev/null || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: r2ghidra-6.2.2-android-arm64
          path: out/
