name: build-r2ghidra

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config wget unzip zip pax gperf python-is-python3 zlib1g-dev patch

      - name: Checkout radare2 6.2.0
        run: git clone --depth 1 --branch 6.2.0 https://github.com/radareorg/radare2

      - name: Build r2 Android SDK (arm64, official recipe)
        run: |
          cd radare2
          sys/android-ndk-install.sh 28 arm64
          sys/android-sdk.sh -a arm64 --api 28 -j "$(nproc)" -o r2sdk.zip
          unzip -q r2sdk.zip -d ../sdk

      - name: Checkout r2ghidra 6.2.2
        uses: actions/checkout@v4
        with:
          repository: radareorg/r2ghidra
          ref: 6.2.2
          path: r2ghidra

      - name: Write meson cross file
        run: |
          TC="$PWD/radare2/toolchain/bin"
          {
            echo "[binaries]"
            echo "c = '$TC/aarch64-linux-android28-clang'"
            echo "cpp = '$TC/aarch64-linux-android28-clang++'"
            echo "ar = '$TC/llvm-ar'"
            echo "strip = '$TC/llvm-strip'"
            echo "pkg-config = 'pkg-config'"
            echo "[host_machine]"
            echo "system = 'android'"
            echo "cpu_family = 'aarch64'"
            echo "cpu = 'aarch64'"
            echo "endian = 'little'"
            echo "[properties]"
            echo "needs_exe_wrapper = true"
          } > cross-android-arm64.ini
          cat cross-android-arm64.ini

      - name: Meson cross build
        run: |
          SDK="$PWD/sdk/radare2-6.2.0-android-sdk"
          cd r2ghidra
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/sdk/radare2-6.2.0-android-sdk/lib/arm64-v8a/pkgconfig"
          meson setup build --buildtype=release --cross-file ../cross-android-arm64.ini -Dprefix=/tmp/r2home
          git apply --verbose ../patches/sleighc-native.patch || patch -p1 -N < ../patches/sleighc-native.patch
          ninja -C build

      - name: Collect artifacts
        run: |
          mkdir -p out
          find r2ghidra/build -name '*.so' -exec cp {} out/ \;
          (cd r2ghidra/build && find . -name '*.sla' | zip -q ../sleigh-compiled.zip -@) || true
          cp r2ghidra/build/sleigh-compiled.zip out/ 2>/dev/null || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: r2ghidra-6.2.2-android-arm64
          path: out/
